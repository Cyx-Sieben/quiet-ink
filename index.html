<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Ink</title>
  <meta name="description" content="Quiet Ink: weekly English writing and vocabulary practice, with friends.">
  <meta name="theme-color" content="#2F5BEA">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var savedTheme = localStorage.getItem('quietink.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Quiet Ink home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-name">QUIET INK</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </header>

  <main id="main" class="desk" tabindex="-1">
    <div id="app" class="app">
      <div class="loading"><p class="pixel-title">Opening your desk</p></div>
    </div>
  </main>

  <footer class="site-footer">
    <span class="label">Quiet Ink</span>
    <span class="ornaments" aria-hidden="true">✸ ✦ ♣</span>
    <a class="label" href="#/privacy">Privacy</a>
    <a class="label" href="#/guidelines">Community guidelines</a>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
