<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Ink</title>
  <meta name="description" content="Quiet Ink: a weekly English writing and vocabulary trainer.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* Apply the saved theme before the page paints, to avoid a flash. */
    try {
      var savedTheme = localStorage.getItem('quietink.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) { /* storage unavailable: follow the system theme */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Quiet Ink home">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-name">QUIET INK</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="home">Desk</a>
      <a href="#/puzzles" data-nav="puzzles">Puzzles</a>
      <a href="#/flashcards" data-nav="flashcards">Cards</a>
      <a href="#/reflection" data-nav="reflection">Write</a>
      <a href="#/mistakes" data-nav="mistakes">Mistakes</a>
      <a href="#/archive" data-nav="archive">Archive</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>

  <main id="main" class="desk" tabindex="-1">
    <div id="app" class="app">
      <div class="loading">
        <p class="pixel-title">Opening your desk</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span class="label">Quiet Ink</span>
    <span class="ornaments" aria-hidden="true">✸ ✦ ♣</span>
    <span class="label">Read · Write · Repeat</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
